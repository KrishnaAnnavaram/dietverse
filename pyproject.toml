[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dietverse"
version = "0.1.0"
description = "COVID diet analytics dashboard plus a talking VR nutrition assistant"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Krishna Annavaram" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pydantic>=2.5",
    "httpx>=0.27",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
web = ["streamlit>=1.32", "plotly>=5.18"]
aws = ["boto3>=1.34"]
all = ["dietverse[api,web,aws]"]
dev = ["pytest>=8"]

[project.scripts]
dietverse = "dietverse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
